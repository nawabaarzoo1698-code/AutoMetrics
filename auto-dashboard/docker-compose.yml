# Local stack: Mongo + Redis + API. Run the web app with `npm run dev` in apps/web.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/auto_dashboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      CORS_ORIGIN: http://localhost:3000
    depends_on: [mongo, redis]
volumes:
  mongo-data:
